name: Crypto Scanner - Every 4 Hours

on:
  schedule:
    - cron: '30 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Tehran
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Persian font
        run: |
          mkdir -p $HOME/fonts
          curl -sL -o /tmp/vazir.zip "https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/Vazirmatn-v33.003.zip"
          unzip -o /tmp/vazir.zip -d /tmp/vazir_font
          cp /tmp/vazir_font/fonts/ttf/Vazirmatn-Regular.ttf $HOME/fonts/
          cp /tmp/vazir_font/fonts/ttf/Vazirmatn-Bold.ttf $HOME/fonts/
          cp /tmp/vazir_font/fonts/ttf/Vazirmatn-Medium.ttf $HOME/fonts/

      - name: Set font path
        run: |
          echo "FONT_DIR=$HOME/fonts" >> $GITHUB_ENV

      - name: Run crypto scanner
        run: |
           python3 run_multi_agent.py

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-reports-${{ github.run_id }}
          path: |
            **/output/*.pdf
            **/output/*.xlsx
          retention-days: 7
