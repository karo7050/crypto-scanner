name: Crypto Scanner - Every 4 Hours

# ============================================================
# اجرای خودکار اسکنر کریپتو هر 4 ساعت
# زمان‌ها به وقت UTC هستند (تهران = UTC + 3:30)
#
# زمان‌بندی (هر 4 ساعت):
#   00:30 UTC = 04:00 تهران
#   04:30 UTC = 08:00 تهران
#   08:30 UTC = 12:00 تهران
#   12:30 UTC = 15:30 تهران (نزدیک ساعت فدرال رزرو 16:00)
#   16:30 UTC = 20:00 تهران
#   20:30 UTC = 00:00 تهران
#
# همچنین امکان اجرای دستی از GitHub
# ============================================================

on:
  schedule:
    # هر 4 ساعت (در دقیقه 30 برای هماهنگی با داده‌های تایم فریم)
    - cron: '30 0,4,8,12,16,20 * * *'
  workflow_dispatch:  # امکان اجرای دستی

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Tehran
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      # 1. Checkout کد
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. نصب Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. نصب وابستگی‌ها
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. دانلود فونت فارسی (Vazirmatn)
      - name: Download Persian font
        run: |
          mkdir -p $HOME/fonts
          curl -sL -o /tmp/vazir.zip "https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/Vazirmatn-v33.003.zip"
          unzip -o /tmp/vazir.zip -d /tmp/vazir_font
          cp /tmp/vazir_font/fonts/ttf/Vazirmatn-Regular.ttf $HOME/fonts/
          cp /tmp/vazir_font/fonts/ttf/Vazirmatn-Bold.ttf $HOME/fonts/
          cp /tmp/vazir_font/fonts/ttf/Vazirmatn-Medium.ttf $HOME/fonts/

      # 5. تنظیم متغیر محیطی برای مسیر فونت
      - name: Set font path
        run: |
          echo "FONT_DIR=$HOME/fonts" >> $GITHUB_ENV

      # 6. اجرای اسکنر
      - name: Run crypto scanner
        run: |
          cd crypto_scanner 2>/dev/null || cd .
          python3 run_scheduled.py

      # 7. ذخیره فایل‌های تولید شده (Artifact)
      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-reports-${{ github.run_id }}
          path: |
            **/output/*.pdf
            **/output/*.xlsx
          retention-days: 7
